<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a6847;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#137a56;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a9e6e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.02" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="280" fill="url(#circle1)" />
  <circle cx="150" cy="520" r="200" fill="url(#circle1)" />
  <circle cx="600" cy="315" r="500" fill="none" stroke="white" stroke-width="1" opacity="0.06" />
