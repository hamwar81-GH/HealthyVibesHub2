  <rect x="80" y="460" width="200" height="48" rx="24" fill="rgba(255,255,255,0.12)" />
  <text x="180" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">2.4M+ Monthly Readers</text>
  <rect x="298" y="460" width="170" height="48" rx="24" fill="rgba(255,255,255,0.12)" />
  <text x="383" y="490" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">48 Expert Authors</text>
